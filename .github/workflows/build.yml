name: Build Print Manager

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace assets even if this version is already released"
        type: boolean
        default: false

# NOTE: deliberately no `paths:` filter. Under `push`, a paths filter applies to
# tag pushes as well, which would silently stop manual re-cuts from building.
# The `version` job below gates instead — it skips everything when the version
# in service/version.py already has a release, so ordinary merges cost ~10s.

env:
  PYTHON_VERSION: "3.11"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_release: ${{ steps.resolve.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from source (or tag)
        id: resolve
        shell: bash
        env:
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          set -euo pipefail

          extract() { sed -n 's/^VERSION = "\(.*\)"$/\1/p' "$1" | head -1; }
          service_version="$(extract service/version.py)"
          manager_version="$(extract manager/version.py)"

          if [[ -z "$service_version" ]]; then
            echo "::error file=service/version.py::Could not parse VERSION"
            exit 1
          fi

          # Both must agree. manager/updater.py compares the release tag against
          # the MANAGER version, so a half-bump ships an update nobody is offered.
          if [[ "$service_version" != "$manager_version" ]]; then
            echo "::error::Version mismatch — service/version.py is '$service_version' but manager/version.py is '$manager_version'. Bump both."
            exit 1
          fi

          # A tag push still wins, so manual re-cuts behave exactly as before.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "Tag push — using tag version $version (source says $service_version)"
          else
            version="$service_version"
            echo "Branch push — using source version $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${version}")"

          if [[ "$code" == "200" && "$FORCE" == "true" ]]; then
            echo "v$version is already released, but force was requested — rebuilding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == "200" ]]; then
            echo "v$version is already released — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == "404" ]]; then
            echo "v$version has no release yet — building."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected HTTP $code checking for an existing release of v$version"
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Print Service ${{ steps.resolve.outputs.version }}"
            if [[ "${{ steps.resolve.outputs.should_release }}" == "true" ]]; then
              echo "Building and releasing \`v${{ steps.resolve.outputs.version }}\`."
            else
              echo "\`v${{ steps.resolve.outputs.version }}\` is already released — build skipped."
              echo ""
              echo "Bump \`service/version.py\` **and** \`manager/version.py\` to cut a new release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows binaries
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${{ needs.version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Patch version files
        shell: python
        run: |
          import re
          version = "${{ steps.version.outputs.version }}"
          for path in ["service/version.py", "manager/version.py"]:
              with open(path, "r") as f:
                  content = f.read()
              content = re.sub(r'VERSION = ".*?"', f'VERSION = "{version}"', content)
              with open(path, "w") as f:
                  f.write(content)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-manager.txt
          pip install pyinstaller

      - name: Build service exe
        run: pyinstaller build/build_service.spec

      - name: Build manager exe
        run: pyinstaller build/build_manager.spec

      - name: Build self-updater exe
        run: pyinstaller build/build_self_updater.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/relims-print-service.exe
            dist/relims-print-manager.exe
            dist/relims-self-updater.exe

  build-windows-installer:
    name: Build Windows installer
    needs: [version, build-windows]
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${{ needs.version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: build/installer.iss
          options: /DAppVersion=${{ steps.version.outputs.version }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/Output/relims-print-manager-setup.exe

  build-linux:
    name: Build Linux binaries
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${{ needs.version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Patch version files
        run: |
          python3 -c "
          import re
          version = '${{ steps.version.outputs.version }}'
          for path in ['service/version.py', 'manager/version.py']:
              with open(path, 'r') as f:
                  content = f.read()
              content = re.sub(r'VERSION = \".*?\"', f'VERSION = \"{version}\"', content)
              with open(path, 'w') as f:
                  f.write(content)
          "

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-manager.txt
          pip install pyinstaller

      - name: Build service binary
        run: pyinstaller build/build_service_linux.spec

      - name: Build manager binary
        run: pyinstaller build/build_manager_linux.spec

      - name: Build self-updater binary
        run: pyinstaller build/build_self_updater.spec

      - name: Create archives
        run: |
          mkdir -p packaging/relims-print-service
          cp dist/relims-print-service packaging/relims-print-service/relims-print-service
          cp setup-print-service.sh packaging/relims-print-service/setup-print-service.sh
          chmod +x packaging/relims-print-service/relims-print-service
          chmod +x packaging/relims-print-service/setup-print-service.sh
          tar czf dist/relims-print-service-linux.tar.gz -C packaging relims-print-service
          cd dist
          tar czf relims-print-manager-linux.tar.gz relims-print-manager

      - name: Create Linux installer script
        run: |
          cp build/linux_installer_header.sh dist/relims-print-manager-linux-install.sh
          tar czf - -C dist relims-print-service relims-print-manager relims-self-updater >> dist/relims-print-manager-linux-install.sh
          chmod +x dist/relims-print-manager-linux-install.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/relims-print-service-linux.tar.gz
            dist/relims-print-manager-linux.tar.gz
            dist/relims-print-manager-linux-install.sh

  release:
    name: Create GitHub Release
    needs: [version, build-windows, build-windows-installer, build-linux]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version
        id: version
        run: echo "version=${{ needs.version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/

      - name: Generate manifest.json
        shell: python
        run: |
          import json
          manifest = {
              "version": "${{ steps.version.outputs.version }}",
              "service_version": "${{ steps.version.outputs.version }}",
              "manager_version": "${{ steps.version.outputs.version }}",
              "assets": {
                  "service_windows": "relims-print-service.exe",
                  "service_linux": "relims-print-service-linux.tar.gz",
                  "manager_windows": "relims-print-manager.exe",
                  "manager_linux": "relims-print-manager-linux.tar.gz"
              }
          }
          with open("artifacts/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit tag_name so a branch push can release too — the action
          # creates the tag at this commit when it doesn't already exist.
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            artifacts/relims-print-service.exe
            artifacts/relims-print-service-linux.tar.gz
            artifacts/relims-print-manager.exe
            artifacts/relims-print-manager-linux.tar.gz
            artifacts/relims-print-manager-setup.exe
            artifacts/relims-print-manager-linux-install.sh
            artifacts/manifest.json
          generate_release_notes: true
